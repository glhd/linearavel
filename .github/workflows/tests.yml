# Kept at this path rather than phpunit.yml: GitHub disables scheduled workflows
# in repositories that go quiet, and the old file had been disabled for inactivity.
# The workflow name is unchanged, so the README badge still resolves.
name: PHPUnit

on:
  push:
  pull_request:
  schedule:
    - cron: '0 14 * * 3' # Run Wednesdays at 2pm EST

jobs:
  php-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2, 8.3, 8.4 ]
        laravel: [ 11.*, 12.*, 13.* ]
        dependency-version: [ stable, lowest ]
        include:
          # orchestra/testbench below 9.2 sets a static property it never declares,
          # which fails every test, so the Laravel 11 floor starts there
          - laravel: 11.*
            testbench: ^9.2
          - laravel: 12.*
            testbench: ^10.0
          - laravel: 13.*
            testbench: ^11.0
        exclude:
          # Laravel 13 needs PHP 8.3 or newer
          - laravel: 13.*
            php: 8.2

    timeout-minutes: 15

    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.dependency-version }})"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, iconv
          tools: composer:v2

      - name: Register the Composer cache directory
        id: composer-cache-files-dir
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ${{ steps.composer-cache-files-dir.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require --no-interaction --prefer-dist --no-update "laravel/framework:${{ matrix.laravel }}"
          composer require --dev --no-interaction --prefer-dist --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --no-interaction --prefer-dist --with-all-dependencies --prefer-${{ matrix.dependency-version }}

      - name: Execute tests
        run: vendor/bin/phpunit
